name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    name: Build & Publish Release Packages
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Parse and validate tag
        id: tag_info
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $stable = [regex]::Match($tag, '^v(\d+\.\d+\.\d+)$').Success
          $pre = [regex]::Match($tag, '^v(\d+\.\d+\.\d+)-([0-9A-Za-z.-]+)$').Success
          if (-not $stable -and -not $pre) {
            Write-Error "Invalid tag '$tag': expected vX.Y.Z (stable) or vX.Y.Z-identifier (pre-release)"
            exit 1
          }
          $ver = $tag.TrimStart('v')
          $channel = if ($stable) { 'stable' } else { 'pre-release' }
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "TAG_NAME=$tag" >> $env:GITHUB_ENV
          echo "CHANNEL=$channel" >> $env:GITHUB_ENV
          Write-Host "Tag $tag -> version $ver ($channel)"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09)
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run verification checks
        shell: pwsh
        run: |
          $fail = $false
          npm run lint;      if ($LASTEXITCODE -ne 0) { $fail = $true }
          npm run typecheck; if ($LASTEXITCODE -ne 0) { $fail = $true }
          npm test;          if ($LASTEXITCODE -ne 0) { $fail = $true }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { $fail = $true }
          # 版本一致性：tag 必须与三处版本源一致
          $tagVer = $env:VERSION
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoLine = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($pkg -ne $tagVer -or $conf -ne $tagVer -or $cargoLine -ne $tagVer) {
            Write-Error "Version mismatch: tag=$tagVer package=$pkg tauri=$conf cargo=$cargoLine"
            $fail = $true
          }
          if ($fail) { exit 1 }

      - name: Build Setup & Portable Packages
        shell: pwsh
        run: |
          .\scripts\build-dist.ps1 -Version $env:VERSION -OutputDir release-artifacts

      - name: Verify required artifacts exist
        shell: pwsh
        run: |
          $required = @(
            "release-artifacts/Pulse-$env:VERSION-windows-x64-setup.exe",
            "release-artifacts/Pulse-$env:VERSION-windows-x64-portable.zip",
            "release-artifacts/DEPENDENCIES.txt",
            "release-artifacts/BUILD_INFO.txt",
            "release-artifacts/SHA256SUMS.txt"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error ("Missing required artifacts: " + ($missing -join ', ')); exit 1 }
          ./scripts/verify-release.ps1 -Directory release-artifacts -Version $env:VERSION

      - name: Generate release notes
        shell: pwsh
        run: |
          # 确定性来源：取 CHANGELOG 中对应版本的段落，整份替换，杜绝重复追加。
          $ver = $env:VERSION
          $body = @()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## ') {
              if ($inSection) { break }
              $inSection = $line -match [regex]::Escape($ver)
            } elseif ($inSection) { $body += $line }
          }
          if ($body.Count -eq 0) { $body = @("Pulse for Windows v$ver", '', 'See commit history for details.') }
          $body | Out-File RELEASE_BODY.md -Encoding utf8

      - name: Refuse mutation of an existing published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view $env:TAG_NAME --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and -not ($existing | ConvertFrom-Json).isDraft) { throw "Release is already published; use a new version." }
          $global:LASTEXITCODE = 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: Pulse for Windows ${{ env.TAG_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          prerelease: ${{ env.CHANNEL == 'pre-release' }}
          body_path: RELEASE_BODY.md
          files: |
            release-artifacts/Pulse-*-windows-x64-setup.exe
            release-artifacts/Pulse-*-windows-x64-portable.zip
            release-artifacts/DEPENDENCIES.txt
            release-artifacts/BUILD_INFO.txt
            release-artifacts/SHA256SUMS.txt

      - name: Verify uploaded draft assets and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:TAG_NAME --dir verified-download
          if ($LASTEXITCODE -ne 0) { throw "Draft download verification failed" }
          ./scripts/verify-release.ps1 -Directory verified-download -Version $env:VERSION
          gh release edit $env:TAG_NAME --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
