name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release Packages
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Node dependencies
        run: npm ci

      - name: Run verification checks
        run: |
          npm run lint
          npm run typecheck
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Extract Tag Version
        id: tag_info
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.TrimStart('v')
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "TAG_NAME=$tag" >> $env:GITHUB_ENV

      - name: Build Setup & Portable Packages
        shell: pwsh
        run: |
          .\scripts\build-dist.ps1 -Version $env:VERSION -OutputDir release-artifacts

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pulse for Windows ${{ env.TAG_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-artifacts/Pulse-*-windows-x64-setup.exe
            release-artifacts/Pulse-*-windows-x64-portable.zip
            release-artifacts/SHA256SUMS.txt
