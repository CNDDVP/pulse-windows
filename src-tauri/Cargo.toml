[package]
name = "pulse-windows"
version = "0.6.6"
description = "A floating Windows monitor for AI coding allowances"
authors = ["CNDDVP"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "system-proxy", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
semver = { version = "1", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
# Round5d 项目二：Discord Rich Presence（opt-in 默认关）。维护中的 IPC 客户端 crate
# （github.com/vionya/discord-rich-presence，1.1.0 于 2026-01 发布）；锁定精确版本。
discord-rich-presence = "=1.1.0"
# Round 6 多设备同步（docs/ROUND6_PLAN.md）：实例内嵌 hub 的最小 HTTP 服务。锁定精确版本。
tiny_http = "=0.12.0"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "UI_Notifications",
    "Data_Xml_Dom"
] }
winreg = "0.55"
webview2-com = "0.38"
windows-core = "0.61"
